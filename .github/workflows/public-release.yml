name: Public release safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-tree:
    name: Public tree (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install public-test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile public Python sources
        run: python -m compileall -q src scripts
      - name: Verify reviewed public tree
        run: python scripts/release_check.py
      - name: Run public-safe tests
        run: python -m pytest
