<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-labelledby="title desc">
  <title id="title">Waveform timing study stages</title>
  <desc id="desc">A repository review covered 309 waveform files. A separate targeted check tested 18 records. One record passed both the frozen automated timing rules and masked visual review, which was insufficient for outcome linkage.</desc>
  <rect width="1040" height="420" fill="#ffffff"/>
  <text x="52" y="52" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#17212b">Timing evidence was too limited for waveform modeling</text>
  <text x="52" y="82" font-family="Arial, sans-serif" font-size="16" fill="#4b5563">The broad review and targeted check served different purposes; this is not a proportional retention funnel.</text>

  <rect x="52" y="125" width="260" height="160" rx="12" fill="#eef5f8" stroke="#2f6f8f" stroke-width="2"/>
  <text x="182" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17212b">Repository review</text>
  <text x="182" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#2f6f8f">309 files</text>
  <text x="182" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">Mapped timing sources and</text>
  <text x="182" y="269" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">identified strong candidates</text>

  <path d="M327 205 H382" stroke="#64748b" stroke-width="3" fill="none"/>
  <path d="M382 205 l-12 -8 v16 z" fill="#64748b"/>

  <rect x="397" y="125" width="260" height="160" rx="12" fill="#f4f6f8" stroke="#64748b" stroke-width="2"/>
  <text x="527" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17212b">Targeted check</text>
  <text x="527" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#475569">18 records</text>
  <text x="527" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">Participant-separated records;</text>
  <text x="527" y="269" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">rules frozen before evaluation</text>

  <path d="M672 205 H727" stroke="#64748b" stroke-width="3" fill="none"/>
  <path d="M727 205 l-12 -8 v16 z" fill="#64748b"/>

  <rect x="742" y="125" width="246" height="160" rx="12" fill="#fff4ea" stroke="#c46b2d" stroke-width="2"/>
  <text x="865" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#17212b">Confirmed support</text>
  <text x="865" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#c46b2d">1 record</text>
  <text x="865" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">Passed automated rules and</text>
  <text x="865" y="269" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">status-masked visual review</text>

  <rect x="218" y="326" width="604" height="52" rx="8" fill="#f8e5e2"/>
  <text x="520" y="359" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#8a352b">Decision: stop before linking oxygen outcomes or building a model</text>
</svg>
